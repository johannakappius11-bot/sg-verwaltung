# Hält das kostenlose Supabase-Projekt aktiv (wird sonst nach 7 Tagen ohne Nutzung pausiert,
# z. B. in der Sommerpause). Benötigt zwei Repository-Secrets: SUPABASE_URL und SUPABASE_ANON_KEY.
name: Supabase aktiv halten
on:
  schedule:
    - cron: '17 6 */3 * *'   # alle 3 Tage
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/check_invite" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" -H "Content-Type: application/json" \
            -d '{"p_token":"keepalive"}'
